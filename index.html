*{box-sizing:border-box}
html,body{min-height:100%}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.shell{max-width:480px;margin:0 auto;min-width:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}

.lang{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px;flex:none}
.top .lang{color:#2E2208;border-color:#2E2208}
.langrow{display:flex;justify-content:flex-end;padding-top:14px}
.search{display:flex;gap:8px;margin-top:12px}

.card .b{padding:9px 11px 12px}

.cw{position:relative;min-width:0}

textarea.in{min-height:90px;resize:vertical}

.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}

.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}

.ph{width:84px;height:84px;border-radius:12px;object-fit:cover;border:1.5px solid var(--line)}

function pubUrl(p){return SB.storage.from('photos').getPublicUrl(p).data.publicUrl}
function enc(im,max,q,limit){
  var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  var d=c.toDataURL('image/jpeg',q);
  while(d.length>limit&&q>.35){q-=.1;d=c.toDataURL('image/jpeg',q)}
  return d;
}

async function loadListings(){
  var a=await SB.from('listings').select('*').order('created_at',{ascending:false}).limit(300);
  var b=await SB.from('listing_photos').select('listing_id,path,position').order('position',{ascending:true});
  if(a.error)return false;
  var ph={},paths={};
  (b.data||[]).forEach(function(r){(ph[r.listing_id]=ph[r.listing_id]||[]).push(pubUrl(r.path));(paths[r.listing_id]=paths[r.listing_id]||[]).push(r.path)});
  S.paths=paths;S.photosOf=ph;
  S.listings=(a.data||[]).map(function(r){
    var u=ph[r.id]||[];
    return {id:r.id,title:r.title,desc:r.description||'',price:Number(r.price),city:r.city,cat:r.category,sellerId:r.seller_id,sellerName:r.seller_name||'',
      ts:Date.parse(r.created_at),sold:!!r.sold,so:r.title_so?{title:r.title_so,desc:r.desc_so||''}:null,thumb:u[0]||null,photoCount:u.length};
  });
  return true;
}

  var r=await SB.from('profiles').select('id,name,city');
  var m={};(r.data||[]).forEach(function(p){m[p.id]={name:p.name,city:p.city}});
  S.users=m;
}

  if(!USER){S.chatsB={};S.chatsS={};return}
  var c=await SB.from('chats').select('*').order('last_at',{ascending:false});
  var m={};
  (c.data||[]).forEach(function(r){m[r.id]={id:r.id,listingId:r.listing_id,buyerId:r.buyer_id,sellerId:r.seller_id,lastText:r.last_text||'',lastFrom:r.last_sender,ts:Date.parse(r.last_at)}});
  S.chatsB=m;S.chatsS={};
}
async function loadMine(){
  if(!USER){S.priv={favs:[],phone:''};S.chatsB={};S.chatsS={};return}
  var p=await SB.from('private_profiles').select('phone').eq('id',USER.id).maybeSingle();
  var f=await SB.from('favorites').select('listing_id').eq('user_id',USER.id);
  S.priv={phone:(p.data&&p.data.phone)||'',favs:(f.data||[]).map(function(r){return r.listing_id})};
  await loadChats();
}

/* ---------- Chats ---------- */
function normMsg(r){return {id:r.id,from:r.sender_id,text:r.body,ts:Date.parse(r.created_at)}}
function addMsg(r){
  if(S.msgs.some(function(x){return x.id===r.id}))return;
  S.msgs=S.msgs.concat([normMsg(r)]).sort(function(a,b){return a.ts-b.ts});
  refreshData();
}
async function loadMsgs(chatId){
  var r=await SB.from('messages').select('*').eq('chat_id',chatId).order('created_at',{ascending:true});
  if(r.error||!S.activeChat||S.activeChat.id!==chatId)return;
  S.msgs=(r.data||[]).map(normMsg);refreshData();
}
function stopMsgs(){if(S.msgChan&&SB){SB.removeChannel(S.msgChan)}S.msgChan=null}
function watchMsgs(chatId){
  stopMsgs();
  S.msgChan=SB.channel('chat-'+chatId).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'chat_id=eq.'+chatId},function(p){
    if(S.activeChat&&S.activeChat.id===chatId)addMsg(p.new);
  }).subscribe();
}
async function openChat(listingId,buyerId,from){
  stopMsgs();
  var ex=myChats().filter(function(c){return c.listingId===listingId&&c.buyerId===buyerId})[0];
  S.msgs=[];S.activeChat={id:ex?ex.id:null,listingId:listingId,buyerId:buyerId};S.chatFrom=from;
  S.view='chat';render();window.scrollTo(0,0);
  if(ex){watchMsgs(ex.id);await loadMsgs(ex.id)}
}
function sendMsg(text){
  text=(text||'').trim();
  var ac=S.activeChat,l=ac&&byId(ac.listingId);
  if(!text||!l||!SB||!USER)return;
  var mineCount=S.msgs.filter(function(m){return m.from===UID}).length;
  queue(async function(){
    if(!ac.id){
      var c=await SB.from('chats').insert({listing_id:l.id,buyer_id:USER.id,seller_id:l.sellerId||null}).select().single();
      if(c.error)throw c.error;
      ac.id=c.data.id;watchMsgs(ac.id);
    }
    var m=await SB.from('messages').insert({chat_id:ac.id,sender_id:USER.id,body:text}).select().single();
    if(m.error)throw m.error;
    addMsg(m.data);
    await loadChats();
  }).then(function(){
    if(!l.sellerId){
      var reply=t('r'+((mineCount%4)+1));
      setTimeout(function(){SB.rpc('sample_reply',{p_chat:ac.id,p_body:reply}).then(function(){return loadMsgs(ac.id)}).then(loadChats)},1100);
    }
  }).catch(function(){toast(t('msgFail'))});
}

/* ---------- Saved items ---------- */
function toggleFav(id){
  if(!USER){S.reg=t('needFav');S.err={};go('auth');return}
  var on=S.priv.favs.indexOf(id)>-1;
  S.priv.favs=on?S.priv.favs.filter(function(x){return x!==id}):S.priv.favs.concat([id]);
  refreshData();
  var op=on?SB.from('favorites').delete().eq('user_id',USER.id).eq('listing_id',id):SB.from('favorites').insert({user_id:USER.id,listing_id:id});
  op.then(function(r){
    if(r.error){S.priv.favs=on?S.priv.favs.concat([id]):S.priv.favs.filter(function(x){return x!==id});refreshData();toast(t('saveFail'))}
  });
}

/* ---------- Sign in screen ---------- */
V.auth=function(){
  var e=S.err,up=S.authMode==='up';
  return '<div class="langrow">'+langBtn()+'</div><div class="hero">'+BANANA.replace('width="34" height="34"','width="72" height="72"')+'<h1>'+esc(t(up?'signUp':'authH1'))+'</h1></div>'+
  '<form class="page" id="authForm" novalidate>'+
  (S.reg?'<p class="err" style="text-align:center">'+esc(S.reg)+'</p>':'')+
  '<label for="aEmail">'+esc(t('email'))+'<input class="in" id="aEmail" type="email" autocomplete="email" inputmode="email"><span class="err">'+esc(e.email||'')+'</span></label>'+
  '<label for="aPass">'+esc(t('password'))+'<input class="in" id="aPass" type="password" autocomplete="'+(up?'new-password':'current-password')+'"><span class="meta" style="margin:0">'+esc(t('passHint'))+'</span><span class="err">'+esc(e.pass||'')+'</span></label>'+
  '<button class="btn" type="submit">'+esc(t(up?'signUp':'signIn'))+'</button>'+
  '<button class="link" type="button" data-act="authmode">'+esc(t(up?'haveAcc':'noAcc'))+'</button>'+
  '<button class="link" type="button" data-act="guest">'+esc(t('guest'))+'</button></form>';
};

/* ---------- Events ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
  if(a==='lang'){setLang()}
  else if(a==='city'){S.city=v;render()}
  else if(a==='cat'){S.cat=v;render()}
  else if(a==='open'){go('detail',{sel:id})}
  else if(a==='back'){if(S.view==='chat')go(S.chatFrom==='msgs'?'msgs':'detail');else go('home')}
  else if(a==='tab'){
    if(v==='post'&&gate('needPost'))return;
    if(v==='msgs'&&gate('needMsg'))return;
    S.err={};S.reg='';go(v);
  }
  else if(a==='chat'){if(gate('needMsg'))return;S.sel=id;openChat(id,UID,'detail')}
  else if(a==='inbox'){S.sel=id;openChat(id,b.dataset.b,'msgs')}
  else if(a==='quick'){sendMsg(v)}
  else if(a==='guest'){S.guest=true;S.reg='';go('home')}
  else if(a==='reg'){S.reg='';S.err={};S.editing=false;go(USER?'welcome':'auth')}
  else if(a==='authmode'){S.authMode=S.authMode==='up'?'in':'up';S.err={};render()}
  else if(a==='signout'){SB.auth.signOut().then(function(){S.reg='';go('home')})}
  else if(a==='editp'){S.reg='';S.err={};S.editing=true;go('welcome')}
  else if(a==='cancel'){S.editing=false;go('me')}
  else if(a==='fav'){toggleFav(id)}
  else if(a==='savedf'){S.saved=!S.saved;render()}
  else if(a==='sold'){
    var l=byId(id);if(!l||!isMine(l))return;
    SB.from('listings').update({sold:!l.sold}).eq('id',id).then(function(r){
      if(r.error){toast(t('saveFail'));return}
      l.sold=!l.sold;toast(t(l.sold?'soldMsg':'availMsg'));refreshData();
    });
  }
  else if(a==='del'){
    var l2=byId(id);if(!l2||!isMine(l2))return;
    var paths=(S.paths&&S.paths[id])||[];
    (paths.length?SB.storage.from('photos').remove(paths):Promise.resolve()).then(function(){
      return SB.from('listings').delete().eq('id',id);
    }).then(function(r){
      if(r&&r.error){toast(t('saveFail'));return}
      S.listings=S.listings.filter(function(x){return x.id!==id});toast(t('removed'));go('home');
    });
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){S.q=ev.target.value;document.getElementById('grid').innerHTML=gridHtml()}
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='pFile'){
    var files=[].slice.call(ev.target.files).slice(0,4-S.draft.photos.length);
    files.forEach(function(f){
      var r=new FileReader();
      r.onload=function(){
        var im=new Image();
        im.onload=function(){
          if(S.draft.photos.length<4)S.draft.photos.push({full:enc(im,900,.8,260000),thumb:enc(im,200,.6,20000)});
          var row=document.getElementById('photoRow');if(row)row.innerHTML=photosHtml();
        };
        im.src=r.result;
      };
      r.readAsDataURL(f);
    });
  }
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  var f=ev.target.id;
  if(f==='authForm'){
    var em=document.getElementById('aEmail').value.trim(),pw=document.getElementById('aPass').value;
    S.err={};
    if(!/^\S+@\S+\.\S+$/.test(em))S.err.email=t('errEmail');
    if(pw.length<6)S.err.pass=t('errPass');
    if(S.err.email||S.err.pass){render();document.getElementById('aEmail').value=em;return}
    var up=S.authMode==='up';
    (up?SB.auth.signUp({email:em,password:pw}):SB.auth.signInWithPassword({email:em,password:pw})).then(function(r){
      if(r.error){S.err={pass:t('authFail')};render();document.getElementById('aEmail').value=em;return}
      if(!r.data.session){S.reg=t('checkMail');S.authMode='in';render();return}
      setUser(r.data.session.user);
      return loadMine().then(function(){
        S.reg='';
        if(!isReg()){S.editing=false;go('welcome')}else go('home');
      });
    }).catch(function(){S.err={pass:t('authFail')};render()});
  }
  else if(f==='regForm'){
    var n=document.getElementById('rName').value.trim(),p=document.getElementById('rPhone').value.trim(),c=document.getElementById('rCity').value;
    S.err={};
    if(n.length<2)S.err.name=t('errName');
    if(p.replace(/\D/g,'').length<7)S.err.phone=t('errPhone');
    if(S.err.name||S.err.phone){render();return}
    if(!USER){go('auth');return}
    var wasEdit=S.editing;
    SB.from('profiles').upsert({id:USER.id,name:n,city:c}).then(function(r1){
      if(r1.error)throw r1.error;
      return SB.from('private_profiles').upsert({id:USER.id,phone:p});
    }).then(function(r2){
      if(r2.error)throw r2.error;
      S.priv.phone=p;S.users[USER.id]={name:n,city:c};
      S.reg='';S.editing=false;S.city='All';
      toast(wasEdit?t('profSaved'):t('welcome',{n:n.split(' ')[0]}));go(wasEdit?'me':'home');
    }).catch(function(){toast(t('saveFail'))});
  }
  else if(f==='chatForm'){var i=document.getElementById('chatIn');var tx=i.value;i.value='';sendMsg(tx);i.focus()}
  else if(f==='postForm'){
    if(S.posting)return;
    var d=S.draft;
    d.title=document.getElementById('pTitle').value.trim();d.price=document.getElementById('pPrice').value.trim();
    d.cat=document.getElementById('pCat').value;d.city=document.getElementById('pCity').value;d.desc=document.getElementById('pDesc').value.trim();
    S.err={};
    if(!d.photos.length)S.err.photos=t('errPhotos');
    if(d.title.length<3)S.err.title=t('errTitle');
    var pr=parseFloat(d.price);if(!(pr>0))S.err.price=t('errPrice');
    if(Object.keys(S.err).length){render();return}
    S.posting=true;var pb=document.getElementById('postBtn');if(pb){pb.disabled=true;pb.textContent=t('posting')}
    var lid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(ch){var r=Math.random()*16|0;return (ch==='x'?r:(r&3|8)).toString(16)});
    var photos=d.photos.slice(),uploaded=[];
    (async function(){
      try{
        var ins=await SB.from('listings').insert({id:lid,seller_id:USER.id,title:d.title,description:d.desc,price:pr,city:d.city,category:d.cat});
        if(ins.error)throw ins.error;
        for(var n=0;n<photos.length;n++){
          var blob=await (await fetch(photos[n].full)).blob();
          var path=USER.id+'/'+lid+'/'+n+'.jpg';
          var up=await SB.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',upsert:true});
          if(up.error)throw up.error;
          uploaded.push({listing_id:lid,path:path,position:n});
        }
        var pr2=await SB.from('listing_photos').insert(uploaded);
        if(pr2.error)throw pr2.error;
        await loadListings();
        S.posting=false;S.draft={photos:[]};S.city='All';S.cat='All';S.q='';S.saved=false;
        toast(t('live'));go('detail',{sel:lid});
      }catch(e){
        try{await SB.from('listings').delete().eq('id',lid)}catch(e2){}
        S.posting=false;toast(t('saveFail'));
        var pb2=document.getElementById('postBtn');if(pb2){pb2.disabled=false;pb2.textContent=t('postBtn')}
      }
    })();
  }
});

/* ---------- Start ---------- */
render();
(async function init(){
  try{
    if(!CFG.url||!CFG.anonKey||/YOUR/i.test(CFG.url+CFG.anonKey)||!window.supabase){S.noCfg=true;S.ready=true;render();return}
    SB=window.supabase.createClient(CFG.url,CFG.anonKey);
    var sess=await SB.auth.getSession();
    setUser(sess.data&&sess.data.session?sess.data.session.user:null);
    SB.auth.onAuthStateChange(function(ev,session){
      var nu=session?session.user:null;
      if((nu&&nu.id)===(USER&&USER.id))return;
      setUser(nu);
      setTimeout(function(){loadMine().then(function(){refreshData()})},0);
    });
    await Promise.all([loadListings(),loadProfiles()]);
    if(USER)await loadMine();
    S.ready=true;
    if(USER&&!isReg()&&!S.welcomed){S.welcomed=true;S.view='welcome'}
    render();
    var rl=debounce(function(){loadListings().then(refreshData)},400);
    SB.channel('banana-public')
      .on('postgres_changes',{event:'*',schema:'public',table:'listings'},rl)
      .on('postgres_changes',{event:'*',schema:'public',table:'listing_photos'},rl)
      .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},function(){loadProfiles().then(refreshData)})
      .subscribe();
    SB.channel('banana-chats')
      .on('postgres_changes',{event:'*',schema:'public',table:'chats'},function(){loadChats().then(function(){if(S.view==='msgs')refreshData()})})
      .subscribe();
  }catch(e){S.ready=true;S.noCfg=!SB;render()}
})();
</script>
