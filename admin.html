
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banana Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fffceb;
      color: #302713;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #302713; }
    .card {
      background: white;
      border: 1px solid #e5dca8;
      border-radius: 12px;
      padding: 18px;
      margin: 16px 0;
    }
    button {
      background: #ffd21f;
      border: 1px solid #302713;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🍌 Banana Admin Dashboard</h1>
  <p>Marketplace moderation panel</p>

  <div class="card">
    <h2>Reported Listings</h2>
    <p>Review suspected scams and prohibited items.</p>
    <p id="status">Database connection not configured yet.</p>
  </div>

  <div class="card">
    <h2>Admin Tools</h2>
    <p>Report review and listing moderation will be added here.</p>
  </div>
</body>
</html>
